<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071628">
  <meta name="description" content="An animated Christmas night with northern lights, a tree made of stardust, and fireworks you can launch.">
  <title>Aurora Christmas</title>
  <style>
    :root {
      color-scheme: dark;
      --ice: #edf7ff;
      --mist: #b8cde3;
      --gold: #ffe9b4;
      --serif: Georgia, 'Times New Roman', serif;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #071321;
      color: var(--ice);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid #ffffe7; outline-offset: 4px; }

    .theater {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      min-height: 390px;
      overflow: hidden;
      background: radial-gradient(ellipse at 62% 14%, #153b42, transparent 52%), #081526;
    }

    .scene, .scene-world, .scene canvas, .shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene { z-index: -1; }
    .scene-world { transform-origin: 0 0; }
    .scene.is-flying .scene-world { will-change: transform; }
    .shade, #sky, #fireworks, #flight-dust { pointer-events: none; }
    .shade {
      background:
        linear-gradient(90deg, #050e1e80, transparent 38%),
        linear-gradient(180deg, #0308148c 0%, transparent 18% 72%, #0308119c 100%);
    }

    #tree { cursor: grab; touch-action: pan-y; }
    #tree:active { cursor: grabbing; }

    .bar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(18px, 3.9vh, 35px) clamp(22px, 5vw, 78px);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: .9375rem;
      font-weight: 500;
      letter-spacing: .15em;
      white-space: nowrap;
      text-shadow: 0 2px 12px #041426;
    }

    .brand-mark { color: var(--gold); font-size: 1.65rem; text-shadow: 0 0 18px #ffe0a690; line-height: 1; }
    .bar-controls, .actions { display: flex; align-items: center; gap: 8px; pointer-events: auto; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 43px;
      padding: 8px 14px;
      border: 1px solid #c4e6ff36;
      border-radius: 999px;
      background: #0a1928ba;
      color: #e8f2fe;
      font-size: .875rem;
      white-space: nowrap;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s, transform .2s;
    }

    .button > span[aria-hidden] { font: 400 1.2rem/1 var(--serif); color: #cee8ff; }
    .button:hover { background: #1c445bcf; border-color: #b6edff87; transform: translateY(-1px); }
    .button[aria-pressed="true"] { border-color: #8adff283; color: #c8f6ff; }
    .button[aria-busy="true"] { opacity: .6; cursor: wait; }

    .greeting {
      position: absolute;
      z-index: 1;
      top: 42.5%;
      left: clamp(26px, 6vw, 106px);
      margin: 0;
      transform: translateY(-40%);
      pointer-events: none;
    }

    .greeting h1 {
      margin: 0;
      color: var(--ice);
      font: 400 clamp(3.55rem, 6.1vw, 7.2rem)/.91 var(--serif);
      letter-spacing: -.07em;
      text-shadow: 0 3px 37px #020a17, 0 0 58px #bcefff29;
    }

    .greeting em { display: block; color: var(--gold); font-weight: 400; }
    .greeting p { max-width: 25ch; margin: 23px 0 0; color: #d3e7fc; font-size: 1rem; line-height: 1.7; letter-spacing: .035em; text-shadow: 0 2px 12px #061421; }
    .theater.is-playing .greeting { animation: title-in 1.8s var(--title-cue) both; }

    @keyframes title-in {
      from { opacity: 0; transform: translateY(calc(-40% + 13px)); }
      to { opacity: 1; transform: translateY(-40%); }
    }

    .scene-footer {
      position: absolute;
      z-index: 1;
      inset: auto clamp(22px, 5vw, 78px) clamp(18px, 4.4vh, 43px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      pointer-events: none;
    }

    .hint, .notice { margin: 0; color: var(--mist); font-size: .875rem; letter-spacing: .045em; text-shadow: 0 1px 10px #000; }
    .hint::before { display: inline-block; content: '↔'; margin-right: 9px; color: #d7eafa; font-size: 1.1rem; vertical-align: -1px; }
    .theater.is-playing .hint, .intro-controls { display: none; }
    .theater.is-playing .intro-controls { display: grid; }

    .intro-controls { width: min(160px, 100%); gap: 1px; }
    .skip {
      justify-self: start;
      min-height: 35px;
      padding: 4px 0;
      border: 0;
      background: none;
      color: #deeeff;
      font-size: .875rem;
      text-shadow: 0 1px 9px #030a12;
      cursor: pointer;
      pointer-events: auto;
    }
    .skip:hover { color: var(--gold); }
    .intro-progress { height: 2px; border-radius: 2px; overflow: hidden; background: #a7c5e244; }
    .intro-progress::after {
      display: block;
      content: '';
      width: 100%;
      height: 100%;
      transform-origin: left;
      background: linear-gradient(90deg, #7bd7e4, #ffe8b1);
      animation: intro-progress var(--show-duration) linear both;
    }

    @keyframes intro-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .notice { color: var(--gold); text-align: right; }
    .actions { gap: 11px; }
    .actions .button { min-height: 47px; padding-inline: 16px; }

    .actions .primary {
      min-width: 108px;
      color: #15283b;
      background: #f4e3b9;
      border-color: #ffeec8;
      font-weight: 670;
      box-shadow: 0 0 26px #fbe8b42f, 0 6px 18px #010a146e;
    }

    .primary > span[aria-hidden] { color: inherit; }
    .primary:hover { background: #fff2d4; color: #142238; }

    .letter {
      width: min(465px, calc(100% - 40px));
      max-height: calc(100% - 40px);
      margin: auto;
      padding: 47px 31px 38px;
      border: 1px solid #e7d8ac;
      border-radius: 10px;
      background: radial-gradient(ellipse at 24% 0%, #fff4d8, transparent 72%), #e9eff5;
      color: #293f55;
      box-shadow: 0 20px 100px #0008;
      text-align: center;
    }

    .letter::backdrop { background: #030b17a3; backdrop-filter: blur(5px); }
    .letter h2 { margin: 13px 0 20px; font: italic 400 clamp(2.2rem, 5vw, 3.2rem)/1 var(--serif); letter-spacing: -.05em; }
    .letter-mark { display: block; color: #926e36; font-size: 2.15rem; line-height: 1; }
    .letter p { margin: 0; font-size: 1rem; line-height: 2; }
    .letter p + p { margin-top: 20px; color: #6b532f; letter-spacing: .13em; }

    .letter-close {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0 0 3px;
      border: 0;
      border-radius: 50%;
      color: #344f67;
      background: transparent;
      font-size: 1.75rem;
      cursor: pointer;
    }

    .letter-close:hover { background: #4c6f8519; }
    .letter-close:focus-visible { outline-color: #344f67; outline-offset: -2px; }

    @media (max-width: 1000px) {
      .greeting h1 { font-size: clamp(2.9rem, 6vw, 5.1rem); }
      .greeting p { font-size: .9rem; }
    }

    @media (max-width: 710px) {
      .bar { padding-inline: 17px; gap: 8px; }
      .brand { gap: 7px; font-size: .8125rem; letter-spacing: .06em; }
      .bar-controls { gap: 5px; }
      .control { width: 42px; padding-inline: 0; }
      .control .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #tree { top: 14%; height: 82%; }
      .greeting { top: max(76px, 12%); left: 20px; transform: none; }
      .greeting h1 { font-size: clamp(2.3rem, 6.1vw, 3.45rem); }
      .greeting em { display: inline; }
      .greeting p { margin-top: 11px; }
      .theater.is-playing .greeting { animation-name: mobile-title-in; }
      .scene-footer { inset-inline: 17px; grid-template-columns: 1fr; justify-items: center; gap: 8px; }
      .hint, .notice:empty { display: none; }
      .scene-guide { display: none; }
      .theater.is-playing .scene-guide { display: block; }
      .intro-controls { width: 118px; justify-items: stretch; }
      .skip { justify-self: center; }
      .notice { text-align: center; }
      .actions { gap: 6px; }
      .actions .button { padding-inline: 12px; }
    }

    @media (max-width: 710px) and (max-height: 520px) {
      .greeting p { display: none; }
    }

    @keyframes mobile-title-in {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="theater" id="theater" aria-labelledby="greeting-title">
    <div class="scene" id="scene">
      <div class="scene-world" id="scene-world">
        <canvas id="sky" aria-hidden="true"></canvas>
        <canvas id="tree" role="img" aria-label="A silver-blue Christmas tree made of stardust beneath the northern lights. Drag to rotate the tree."></canvas>
        <canvas id="fireworks" aria-hidden="true"></canvas>
      </div>
      <canvas id="flight-dust" width="1" height="1" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>
    </div>

    <header class="bar">
      <p class="brand"><span class="brand-mark" aria-hidden="true">✧</span>Aurora Christmas</p>
      <div class="bar-controls" aria-label="Scene settings" role="group">
        <button class="button control" id="music-toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">♪</span><span class="label">Music</span>
        </button>
        <button class="button control" id="snow-toggle" type="button" aria-pressed="true">
          <span aria-hidden="true">❄</span><span class="label">Snow</span>
        </button>
        <button class="button control" id="fullscreen" type="button" aria-pressed="false">
          <span aria-hidden="true">⛶</span><span class="label">Full Screen</span>
        </button>
      </div>
    </header>

    <section class="greeting" aria-labelledby="greeting-title">
      <h1 id="greeting-title">Merry <em>Christmas</em></h1>
      <p>May a little starlight find you this winter.</p>
    </section>

    <footer class="scene-footer">
      <div class="scene-guide">
        <p class="hint">Drag to rotate the tree</p>
        <div class="intro-controls">
          <button class="skip" id="skip-intro" type="button">Skip Intro</button>
          <div class="intro-progress" aria-hidden="true"></div>
        </div>
      </div>
      <div class="actions" aria-label="Christmas show controls" role="group">
        <button class="button" id="replay" type="button"><span aria-hidden="true">↻</span>Replay</button>
        <button class="button primary" id="burst" type="button"><span aria-hidden="true">✦</span>Fireworks</button>
        <button class="button" id="open-letter" type="button"><span aria-hidden="true">✉</span>Open Card</button>
      </div>
      <p class="notice" id="notice" role="status"></p>
    </footer>
  </main>

  <dialog class="letter" id="letter" aria-labelledby="letter-title">
    <form method="dialog">
      <button class="letter-close" type="submit" aria-label="Close card">×</button>
    </form>
    <span class="letter-mark" aria-hidden="true">✧</span>
    <h2 id="letter-title">A Winter Wish</h2>
    <p>May there always be a light left on for you.<br>And may something good be just around the corner.</p>
    <p>Merry Christmas</p>
  </dialog>
  <script>
    const christmasShow = Object.freeze({
      duration: 25,
      lake: 5.4,
      assembly: 7.35,
      garland: 12.55,
      crown: 16.65,
      greeting: 17.05,
      fireworks: [17.75, 19.7, 21.6],
    });

    const christmasComet = (() => {
      function ease(value) {
        const t = Math.max(0, Math.min(1, value));
        return t * t * (3 - 2 * t);
      }

      return {
        ease,
        progressAt(seconds) {
          return ease((seconds - 0.95) / (christmasShow.lake - 1.13));
        },
        position(progress, width, height) {
          const turn = progress * Math.PI * 2 * 3.2 - 0.76;
          const radius = (1 - progress) ** 0.92 * 0.235;
          const center = width * (width > height * 1.28 ? 0.525 : 0.5);
          return {
            x: center + Math.sin(turn) * radius * Math.min(height, width * 2.04),
            y: (0.79 + (0.165 - 0.79) * progress ** 1.42 + Math.cos(turn) * radius * 0.19) * height,
          };
        },
      };
    })();
  </script>

  <script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const STAR_Y = 0.165;
  const TIP_Y = 0.19;
  const BASE_Y = 0.744;
  const GROUND_Y = 0.79;
  const INTRO_SECONDS = christmasShow.duration;
  const GARLAND_POINTS = 575;
  const GATHER_SECONDS = 6.96;
  const ROOT_ANGLE = Math.PI * (3 - Math.sqrt(5));
  const COLORS = ['#526c9c', '#809dd1', '#a1c4f5', '#bedbff', '#def1ff', '#f7fbff', '#fff4db', '#e8d5ad'];

  function mix(a, b, amount) {
    return a + (b - a) * amount;
  }

  function smooth(value) {
    const amount = Math.max(0, Math.min(1, value));
    return amount * amount * (3 - 2 * amount);
  }

  function seededRandom(seed) {
    return () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function radiusAt(progress) {
    return 0.203 * progress ** 0.91;
  }

  const garland = Array.from({ length: 2 }, (_, strand) =>
    Array.from({ length: GARLAND_POINTS + 1 }, (_, index) => {
      const along = index / GARLAND_POINTS;
      const progress = 0.982 - along * 0.959;
      const theta = along * TAU * 9.25 + 0.37 + (strand ? 0.55 * (1 - along * 0.59) : 0);
      const radius = radiusAt(progress) * (1.05 + 0.057 * Math.sin(theta * 1.7) + 0.022 * Math.cos(theta * 3.4));
      const y = mix(TIP_Y, BASE_Y, progress) + Math.sin(theta * 2.4) * 0.00205 + (strand ? 0.0048 : 0);
      return { x: Math.cos(theta) * radius, y, z: Math.sin(theta) * radius };
    })
  );

  function makeParticles() {
    const random = seededRandom(241225);
    const needles = [];
    const ornaments = [];

    function point(progress, radius, theta, color, size, opacity) {
      return {
        x: radius * Math.cos(theta),
        z: radius * Math.sin(theta),
        y: mix(TIP_Y, BASE_Y, progress),
        yStart: GROUND_Y + (random() - 0.5) * 0.055,
        progress,
        radius,
        theta,
        delay: (1 - progress) * 1.25 + random() * 0.89,
        phase: random() * TAU,
        color,
        size,
        opacity,
      };
    }

    for (let index = 0; index < 4820; index++) {
      const progress = 0.006 + random() ** 0.57 * 0.988;
      const radius = radiusAt(progress) * (0.12 + random() ** 0.51 * 0.88);
      const color = Math.floor(random() ** 1.45 * 6);
      needles.push(point(progress, radius, random() * TAU, color, 0.34 + random() ** 3 * 1.28, 0.32 + random() * 0.61));
    }

    for (let layer = 0; layer < 17; layer++) {
      const height = (layer + 1) / 17;
      const branchCount = Math.round(6 + 12 * height);
      const phase = random() * TAU;
      for (let branch = 0; branch < branchCount; branch++) {
        const angle = phase + branch * TAU / branchCount + (random() - 0.5) * 0.25;
        const end = height + (random() - 0.5) * 0.036;
        const reach = radiusAt(end) * (0.81 + random() * 0.31);
        for (let needle = 0; needle < 15 + height * 8; needle++) {
          const length = random() ** 0.66;
          const progress = Math.max(0.006, end - (1 - length) * 0.1 + (random() - 0.55) * 0.032);
          const twig = (random() - 0.5) * (0.54 - length * 0.31);
          const tint = random();
          const color = tint > 0.973 ? 6 : tint > 0.86 ? 5 : 1 + Math.floor(tint / 0.22);
          needles.push(point(progress, reach * (0.36 + 0.64 * length), angle + twig, color, 0.43 + random() ** 2.5 * 1.52, 0.48 + random() * 0.5));
        }

        if (random() < 0.73) {
          ornaments.push(point(end - 0.013, reach * 0.97, angle, random() > 0.64 ? 6 : 4, 1.4 + random() ** 2 * 3.1, 0.7 + random() * 0.3));
        }
      }
    }

    const ground = Array.from({ length: 1420 }, () => ({
      angle: random() * TAU,
      radius: 0.031 + random() ** 0.47 * 0.28,
      y: GROUND_Y + (random() - 0.5) * (0.009 + random() ** 2 * 0.031),
      phase: random() * TAU,
      color: random() < 0.71 ? 2 + Math.floor(random() * 3) : 5,
      size: 0.39 + random() ** 3 * 1.55,
      opacity: 0.19 + random() * 0.73,
    }));

    needles.forEach((point, index) => {
      const level = Math.max(0, 1 - point.progress);
      const bunch = Math.floor(level * 17.5) / 17.5;
      const scatter = point.delay - level * 1.25;
      point.arrival = Math.max(0, bunch * 2.76 + scatter * 1.03);
      point.root = 0.18 + point.phase / TAU * 0.18 + point.radius * 0.21;
      point.twist = 2.2 + point.phase * 0.43;
      point.comet = point.color >= 2 && index % 27 === 0;
    });
    needles.sort((first, second) => first.color - second.color);
    ground.sort((first, second) => first.color - second.color);
    return { needles, ornaments, ground };
  }

  function glowSprite(color) {
    const sprite = document.createElement('canvas');
    sprite.width = 48;
    sprite.height = 48;
    const context = sprite.getContext('2d');
    const gradient = context.createRadialGradient(24, 24, 0, 24, 24, 24);
    gradient.addColorStop(0, color);
    gradient.addColorStop(0.12, `${color}eb`);
    gradient.addColorStop(0.22, `${color}8d`);
    gradient.addColorStop(0.44, `${color}39`);
    gradient.addColorStop(0.73, `${color}0c`);
    gradient.addColorStop(1, `${color}00`);
    context.fillStyle = gradient;
    context.fillRect(0, 0, 48, 48);
    return sprite;
  }

  window.createChristmasTree = function createChristmasTree(canvas) {
    const context = canvas.getContext('2d', { alpha: true });
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const particles = makeParticles();
    const glows = COLORS.map(glowSprite);
    const sparks = [];
    const projected = { x: 0, y: 0, depth: 0, perspective: 1 };
    const flow = { x: 0, y: 0, z: 0 };
    let width = 0;
    let height = 0;
    let ratio = 1;
    let horizontal = 1;
    let unit = 1;
    let center = 0;
    let rotation = -0.42;
    let targetRotation = rotation;
    let cos = 1;
    let sin = 0;
    let start = performance.now();
    let last = 0;
    let frame = 0;
    let pointerId;
    let pointerX;

    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      ratio = Math.min(window.devicePixelRatio || 1, width < 650 ? 1.65 : 1.8);
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      horizontal = Math.min(height, width * 2.04);
      unit = Math.max(0.74, Math.min(1.37, Math.min(height / 810, width / 410)));
      center = width * (width > height * 1.28 ? 0.525 : 0.5);
      draw(performance.now());
    }

    function project(x, y, z) {
      const depth = x * sin + z * cos;
      const sideways = x * cos - z * sin;
      const perspective = 1 / (1 - depth * 0.67);
      projected.x = center + sideways * horizontal * perspective;
      projected.y = (y + depth * 0.137) * height;
      projected.depth = depth;
      projected.perspective = perspective;
      return projected;
    }

    function light(x, y, diameter, color, opacity) {
      if (opacity <= 0) return;
      context.globalAlpha = Math.min(1, opacity);
      context.drawImage(glows[color], x - diameter * 0.5, y - diameter * 0.5, diameter, diameter);
    }

    function haze(x, y, radiusX, radiusY, color, opacity) {
      if (opacity <= 0) return;
      context.save();
      context.translate(x, y);
      context.scale(radiusX, radiusY);
      context.globalAlpha = Math.min(1, opacity);
      const gradient = context.createRadialGradient(0, 0, 0, 0, 0, 1);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, `${color.slice(0, 7)}00`);
      context.fillStyle = gradient;
      context.fillRect(-1, -1, 2, 2);
      context.restore();
    }

    function diamond(x, y, radiusX, radiusY, color, opacity) {
      context.globalAlpha = Math.min(1, Math.max(0, opacity));
      context.fillStyle = color;
      context.beginPath();
      context.moveTo(x, y - radiusY);
      context.quadraticCurveTo(x + radiusX * 0.06, y - radiusY * 0.04, x + radiusX, y);
      context.quadraticCurveTo(x + radiusX * 0.06, y + radiusY * 0.04, x, y + radiusY);
      context.quadraticCurveTo(x - radiusX * 0.06, y + radiusY * 0.04, x - radiusX, y);
      context.quadraticCurveTo(x - radiusX * 0.06, y - radiusY * 0.04, x, y - radiusY);
      context.fill();
    }

    function flare(x, y, size, opacity, warm) {
      if (opacity <= 0) return;
      const color = warm ? 6 : 5;
      haze(x, y, size * 7.9, size * 0.27, warm ? '#d7d5ee9c' : '#8bb7ffaa', opacity * 0.84);
      light(x, y, size * 7.3, warm ? 7 : 3, opacity * 0.46);
      light(x, y, size * 3.8, color, opacity * 0.9);
      light(x, y, size, 5, opacity);
      diamond(x, y, size * 2.33, size * 0.19, '#e6eeff', opacity * 0.8);
      diamond(x, y, size * 0.23, size * 1.48, '#ffffff', opacity);
      context.save();
      context.translate(x, y);
      context.rotate(Math.PI * 0.245);
      diamond(0, 0, size * 0.73, size * 0.57, '#fff4dd', opacity * 0.9);
      context.restore();
    }

        const { ease, progressAt, position } = christmasComet;

        function frame(now) {
          const seconds = Math.max(0, (now - at) / 1000);
          if (motion.matches || seconds >= exitAt + pullbackDuration) {
            resetCamera();
            return;
          }

          const { width, height, treeWidth, treeHeight, treeTop } = cameraBounds;
          const progress = progressAt(seconds);
          const head = position(progress, treeWidth, treeHeight);
          const ahead = position(progressAt(seconds + 0.20), treeWidth, treeHeight);
          const travel = ease(seconds / 1.46) * (1 - ease((seconds - exitAt) / pullbackDuration));
          const zoom = 1 + travel * ((width < 710 ? 0.64 : 0.88) + Math.sin(progress * Math.PI) * 0.18);
          const roll = travel * Math.sin(progress * Math.PI * 2.4 + 0.34) * 0.052;
          const cos = Math.cos(roll);
          const sin = Math.sin(roll);

          const aimX = width * (0.025 + 0.032 * Math.sin(progress * Math.PI * 2));
          const aimY = height * (0.145 - progress * 0.29);
          const leadX = head.x + (ahead.x - head.x) * 0.42;
          const leadY = treeTop + head.y + (ahead.y - head.y) * 0.42;
          const desiredX = leadX - (aimX * cos + aimY * sin) / zoom;
          const desiredY = leadY - (aimY * cos - aimX * sin) / zoom;

          // Clamp the camera in world coordinates so rotated viewport corners stay inside the sky.
          const halfWidth = (width * cos + height * Math.abs(sin)) / (2 * zoom);
          const halfHeight = (height * cos + width * Math.abs(sin)) / (2 * zoom);
          const centerX = Math.max(halfWidth, Math.min(width - halfWidth, desiredX));
          const centerY = Math.max(halfHeight, Math.min(height - halfHeight, desiredY));
          const a = cos * zoom;
          const b = sin * zoom;
          const x = width / 2 - a * centerX + b * centerY;
          const y = height / 2 - b * centerX - a * centerY;
          world.style.transform = `matrix(${a}, ${b}, ${-b}, ${a}, ${x}, ${y})`;
          drawFlightDust(seconds, progress, travel, width, height);
          cameraFrame = requestAnimationFrame(frame);
        }

        frame(at);
      }

      function clearIntro() {
        for (const timer of introTimers) clearTimeout(timer);
        introTimers.length = 0;
        resetCamera();
        theater.classList.remove('is-playing');
        if (document.activeElement === skip) replay.focus();
      }

      function skipIntro() {
        clearIntro();
        const settledAt = performance.now() - showDuration;
        tree.replay(settledAt);
        sky.replay(settledAt);
        fireworks.finish();
      }

      function playIntro() {
        if (motion.matches) {
          skipIntro();
          return;
        }
        clearIntro();
        void theater.offsetWidth;
        const at = performance.now();
        tree.replay(at);
        sky.replay(at);
        fireworks.replay(at);
        theater.classList.add('is-playing');
        followComet(at);
        const accents = [
          ['seed', 0.85],
          ['gather', christmasShow.assembly + 0.6],
          ['crown', christmasShow.crown + 0.35],
          ...christmasShow.fireworks.map(time => ['fireworks', time + 0.7]),
        ];
        for (const [kind, seconds] of accents) {
          const cueAt = at + seconds * 1000;
          introTimers.push(setTimeout(() => {
            if (!document.hidden && performance.now() - cueAt < 750) music?.cue(kind);
          }, Math.max(0, cueAt - performance.now())));
        }
        introTimers.push(setTimeout(clearIntro, Math.max(0, at + showDuration - performance.now())));
      }

      replay.addEventListener('click', playIntro);
      skip.addEventListener('click', skipIntro);
      window.addEventListener('resize', () => {
        if (cameraFrame) measureCamera();
      });
      motion.addEventListener('change', () => {
        if (motion.matches && theater.classList.contains('is-playing')) skipIntro();
      });

      element('burst').addEventListener('click', () => {
        fireworks.burst();
        tree.burst();
        music?.cue('fireworks');
      });

      snowToggle.addEventListener('click', () => {
        const showSnow = snowToggle.getAttribute('aria-pressed') !== 'true';
        snowToggle.setAttribute('aria-pressed', String(showSnow));
        sky.setSnow(showSnow);
      });

      musicToggle.addEventListener('click', async () => {
        if (musicToggle.getAttribute('aria-busy') === 'true') return;
        const playing = musicToggle.getAttribute('aria-pressed') === 'true';
        notice.textContent = '';
        musicToggle.setAttribute('aria-busy', 'true');
        try {
          music ??= window.createChristmasMusic();
          await (playing ? music.pause() : music.play());
          musicToggle.setAttribute('aria-pressed', String(!playing));
        } catch {
          notice.textContent = 'Music is unavailable in this browser.';
        } finally {
          musicToggle.removeAttribute('aria-busy');
        }
      });

      fullscreen.addEventListener('click', async () => {
        notice.textContent = '';
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          notice.textContent = 'Press F11 to enter full screen.';
        }
      });

      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        fullscreen.setAttribute('aria-pressed', String(active));
        fullscreen.querySelector('.label').textContent = active ? 'Exit Full Screen' : 'Full Screen';
      });

      element('open-letter').addEventListener('click', () => letter.showModal());
      letter.addEventListener('click', event => {
        if (event.target !== letter) return;
        const { top, right, bottom, left } = letter.getBoundingClientRect();
        if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) letter.close();
      });
      playIntro();
    })();
  </script>
</body>
</html>
